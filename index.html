<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="scripts/controller.js"></script>
    <title>Onet Connect</title>
</head>
<body>
    <section>
        <div id="control-bar">
            <button id="new-game-button">New game</button>
            <h1 id="notify-text"></h1>
            <div id="time-bar" aria-label="Time remaining">
                <div id="time-bar-fill"></div>
                <span id="time-text">00:00</span>
            </div>
        </div>
        <div id="game-section">
            <canvas id="game-overlay-canvas"></canvas>
            <div id="game-container">
                <!-- Reserved for js to create table element -->
            </div>
        </div>
        <audio
            id="click-sound"
            preload="auto"
            src="sound/pick.mp3"
        ></audio>
        <audio
            id="match-sound"
            preload="auto"
            src="sound/ting.mp3"
        ></audio>
        <audio
            id="bg-sound"
            preload="auto"
            loop
            autoplay
            src="sound/audio.mp3"
        ></audio>
    </section>
</body>
</html>
